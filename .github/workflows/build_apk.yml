name: Build Full Universal APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Free up disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android || true
          df -h

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Full Universal Website Debug APK
        shell: bash
        env:
          GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=1536m"
        run: |
          set -o pipefail
          ./gradlew :app:assembleWebsiteProdDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Verify APK exists and print size
        run: |
          APKS=$(find app/build/outputs/apk -type f -name "*.apk")
          if [ -z "$APKS" ]; then
            echo "ERROR: APK file was not generated!"
            tail -n 80 build.log || true
            exit 1
          fi
          ls -lh $APKS

      - name: Upload Full APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telefost-full-universal-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: telefost-build-log
          path: build.log
