name: Build Full APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Free up disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android || true
          df -h

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Full Universal Debug APK
        env:
          GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=1536m"
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload All APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: telefost-full-apk
          path: app/build/outputs/apk/**/*.apk
